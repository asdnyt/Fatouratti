name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - run: |
          OUT=dist
          [ -d dist ] || OUT=build
          APPID=$(grep -m1 -oP 'applicationId\s*=?\s*"\K[^"]+' android/app/build.gradle || true)
          [ -z "$APPID" ] && APPID=com.fatouratti.app
          printf '{"appId":"%s","appName":"Fatouratti","webDir":"%s"}' "$APPID" "$OUT" > capacitor.config.json
          cat capacitor.config.json
          ls "$OUT" | head
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --stacktrace
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk Fatouratti.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fatouratti build ${{ github.run_number }}
          files: Fatouratti.apk
